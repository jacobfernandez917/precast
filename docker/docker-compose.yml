# ─── App Stack ──────────────────────────────────────────────────────────────
# Apps: Mastra agents (agents), Next web (web). Identity: Keycloak (local dev).
# Postgres + Redis are NOT run here — point the app at your own remote/managed
# services via the root .env (DATABASE_URL, REDIS_URL). DATABASE_URL accepts
# EITHER a managed Postgres URL or a local SQLite file (getDatabaseKind() in
# packages/shared/src/database.ts detects which) — either way, no Postgres
# runs in this Compose file. Keycloak runs locally for convenient dev auth; in
# production point KEYCLOAK_TOKEN_ISSUER_URI at a managed Keycloak instead of
# this container. See .env.example.
# Run with: docker compose -f docker/docker-compose.yml up -d
# Override with: docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml up -d
# App (container) ports are set by `pnpm set-ports` / `pnpm bootstrap` — change
# them there, not by hand, so every config, script, and doc stays in sync.
# PUBLISHED HOST PORTS are separate: set AGENTS_HOST_PORT / WEB_HOST_PORT in the
# root .env to map the containers to different host ports (they default to the
# container port). Example: AGENTS_HOST_PORT=60000, WEB_HOST_PORT=60001.
# SERVICE SELECTION: each service declares a `profiles:` entry matching its own
# name, and COMPOSE_PROFILES in the root .env picks which run (Compose's own
# mechanism — docs.docker.com/compose/how-tos/profiles). Default (see
# .env.example) is all three; e.g. COMPOSE_PROFILES=web,keycloak skips
# building/running `agents` here (agents hosted elsewhere, e.g. an AgentBase
# import). `pnpm docker:up`/`down`/`logs`/`ps`/`rebuild` all pass `--env-file
# .env` so this file's vars (ports, profiles, Keycloak admin) actually apply —
# Compose does NOT read the repo-root .env by default when invoked with
# `-f docker/docker-compose.yml` from the repo root.

services:
  agents:
    profiles: ['agents']
    build:
      context: ..
      dockerfile: apps/agents/Dockerfile
    container_name: precast-agents
    restart: unless-stopped
    # Load the user's root .env — this is where DATABASE_URL (Postgres or
    # local SQLite) / REDIS_URL / KEYCLOAK_TOKEN_ISSUER_URI live. Optional so
    # the stack still boots without one; the app fails fast if a required var
    # is missing.
    env_file:
      - path: ../.env
        required: false
    environment:
      MASTRA_HOST: 0.0.0.0
      MASTRA_PORT: 4111
      MASTRA_DB_URL: file:/data/mastra.db
      LOG_LEVEL: info
    ports:
      # host (AGENTS_HOST_PORT, default 4111) → container 4111
      - '${AGENTS_HOST_PORT:-4111}:4111'
    volumes:
      - precast-agents-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://localhost:4111/api/agents").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  web:
    profiles: ['web']
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: precast-web
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      WEB_PORT: 3000
      # Reach the agents app over the Docker network, not localhost.
      MASTRA_INTERNAL_URL: http://agents:4111
      # AgentBase is the default transport, but this self-contained stack has no
      # AgentBase service — so opt into direct in-cluster A2A. Set to "1" (with
      # the Application credentials + AGENTBASE_AGENT_URL_* — see .env.example)
      # to proxy through AgentBase instead.
      ENABLE_AGENTBASE: '0'
    ports:
      # host (WEB_HOST_PORT, default 3000) → container 3000
      - '${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      agents:
        condition: service_healthy
        # Optional: don't fail Compose validation when `agents` is excluded via
        # COMPOSE_PROFILES (agents hosted elsewhere). Still waited on for health
        # when `agents` IS in the active profile set.
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://localhost:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Keycloak (OIDC) for local development. Runs in dev mode (HTTP, no TLS).
  # Admin console at http://localhost:${KEYCLOAK_HOST_PORT:-8080} (admin/admin by
  # default). Nothing depends on it, so no healthcheck. In production, use a
  # managed Keycloak and set KEYCLOAK_TOKEN_ISSUER_URI accordingly.
  keycloak:
    profiles: ['keycloak']
    image: quay.io/keycloak/keycloak:latest
    container_name: precast-keycloak
    restart: unless-stopped
    command: ['start-dev']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: 'true'
    ports:
      # host (KEYCLOAK_HOST_PORT, default 8080) → container 8080
      - '${KEYCLOAK_HOST_PORT:-8080}:8080'
    volumes:
      - precast-keycloak-data:/opt/keycloak/data

volumes:
  precast-agents-data:
  precast-keycloak-data:
