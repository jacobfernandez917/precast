# ─── App Stack ──────────────────────────────────────────────────────────────
# Apps: Mastra agents (agents), Next web (web). Identity: Keycloak (local dev).
# Postgres + Redis are NOT run here — point the app at your own remote/managed
# services via the root .env (DATABASE_URL, REDIS_URL). DATABASE_URL must be a
# managed Postgres URL (ADR-002 — SQLite is rejected at boot); "always Postgres"
# is about the engine, not where it runs, so no Postgres runs in this Compose
# file either. Keycloak runs locally for convenient dev auth; in
# production point KEYCLOAK_TOKEN_ISSUER_URI at a managed Keycloak instead of
# this container. See .env.example.
# Run with: docker compose -f docker/docker-compose.yml up -d
# Override with: docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml up -d
# App (container) ports are set by `pnpm set-ports` / `pnpm bootstrap` — change
# them there, not by hand, so every config, script, and doc stays in sync.
# PUBLISHED HOST PORTS are separate: set AGENTS_HOST_PORT / WEB_HOST_PORT in the
# root .env to map the containers to different host ports (they default to the
# container port). Example: AGENTS_HOST_PORT=60000, WEB_HOST_PORT=60001.
# SERVICE SELECTION: each service declares a `profiles:` entry matching its own
# name, and COMPOSE_PROFILES in the root .env picks which run (Compose's own
# mechanism — docs.docker.com/compose/how-tos/profiles). Default (see
# .env.example) is all three; e.g. COMPOSE_PROFILES=web,keycloak skips
# building/running `agents` here (agents hosted elsewhere, e.g. an AgentBase
# import). `pnpm docker:up`/`down`/`logs`/`ps`/`rebuild` all pass `--env-file
# .env` so this file's vars (ports, profiles, Keycloak admin) actually apply —
# Compose does NOT read the repo-root .env by default when invoked with
# `-f docker/docker-compose.yml` from the repo root.

# PROJECT NAME — do not remove, and keep it equal to this repo's project name.
# Without it, Compose derives the project name from the compose FILE's parent
# directory — always `docker/` here — so EVERY repo built from this boilerplate
# would share one namespace ("docker"), and `pnpm docker:up` in one repo would
# adopt, recreate, and stop ANOTHER repo's containers and volumes. An explicit
# name keeps each repo's containers, volumes, and networks isolated; Compose also
# prefixes the volume names below with it. `pnpm rename` / `pnpm bootstrap`
# rewrite the value on the next line, so it follows the project automatically.
# (This comment deliberately avoids naming the placeholder, so a rename can't
# turn it into nonsense.)
name: precast

services:
  agents:
    profiles: ['agents']
    build:
      context: ..
      dockerfile: apps/agents/Dockerfile
      args:
        # Upgraded by `pnpm poc` to a prebuilt deps image when one matches this
        # lockfile (scripts/deps-image.mjs); plain node otherwise, which is the
        # behaviour every clone had before deps images existed.
        BASE_IMAGE: ${BASE_IMAGE:-node:24-alpine}
    container_name: precast-agents
    restart: unless-stopped
    # Load the user's root .env — this is where DATABASE_URL (managed Postgres)
    # / REDIS_URL / KEYCLOAK_TOKEN_ISSUER_URI live. Optional so the stack still
    # boots without one; the app fails fast if a required var is missing.
    env_file:
      - path: ../.env
        required: false
    # NOTE: keys listed here OVERRIDE env_file. Deliberately no MASTRA_DB_URL /
    # DATABASE_URL — agent memory lives in the managed Postgres from .env
    # (ADR-002), and hardcoding a value here would silently shadow it.
    environment:
      MASTRA_HOST: 0.0.0.0
      MASTRA_PORT: 45000
      LOG_LEVEL: info
    ports:
      # host (AGENTS_HOST_PORT, default 45000) → container 45000
      - '${AGENTS_HOST_PORT:-45000}:45000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://localhost:45000/api/agents").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  web:
    profiles: ['web']
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Upgraded by `pnpm poc` to a prebuilt deps image when one matches this
        # lockfile (scripts/deps-image.mjs); plain node otherwise, which is the
        # behaviour every clone had before deps images existed.
        BASE_IMAGE: ${BASE_IMAGE:-node:24-alpine}
    container_name: precast-web
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 45001
      WEB_PORT: 45001
      # Reach the agents app over the Docker network, not localhost.
      MASTRA_INTERNAL_URL: http://agents:45000
      # AgentBase is the default transport, but this self-contained stack has no
      # AgentBase service — so opt into direct in-cluster A2A. Set to "1" (with
      # the Application credentials + AGENTBASE_AGENT_URL_* — see .env.example)
      # to proxy through AgentBase instead.
      ENABLE_AGENTBASE: '0'
    ports:
      # host (WEB_HOST_PORT, default 45001) → container 45001
      - '${WEB_HOST_PORT:-45001}:45001'
    depends_on:
      agents:
        condition: service_healthy
        # Optional: don't fail Compose validation when `agents` is excluded via
        # COMPOSE_PROFILES (agents hosted elsewhere). Still waited on for health
        # when `agents` IS in the active profile set.
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://localhost:45001/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Keycloak (OIDC) for local development. Runs in dev mode (HTTP, no TLS).
  # Admin console at http://localhost:${KEYCLOAK_HOST_PORT:-45002} (admin/admin by
  # default). Nothing depends on it, so no healthcheck. In production, use a
  # managed Keycloak and set KEYCLOAK_TOKEN_ISSUER_URI accordingly.
  keycloak:
    profiles: ['keycloak']
    image: quay.io/keycloak/keycloak:latest
    container_name: precast-keycloak
    restart: unless-stopped
    command: ['start-dev']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: 'true'
    ports:
      # host (KEYCLOAK_HOST_PORT, default 8080) → container 8080
      - '${KEYCLOAK_HOST_PORT:-45002}:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data
    # Without this, `pnpm poc` reports the stack healthy and prints URLs while
    # Keycloak is still starting — which surfaces to the user as a confusing auth
    # failure rather than "still booting".
    #
    # The image ships no curl or wget, so the check goes through bash's /dev/tcp
    # against the MANAGEMENT port (9000, where Keycloak 25+ serves health), not
    # the HTTP port. Verified against a running container: healthy → exit 0,
    # missing marker → 1, dead port → 1.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q ''"status": "UP"'' <&3',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

# Volume names are deliberately NOT prefixed with the project name — Compose
# already prefixes them with the project (`name:` above), so declaring
# `<project>-keycloak-data` would resolve to a stuttering
# `<project>_<project>-keycloak-data`. Declared bare, they resolve to
# `<project>_keycloak-data`. That project prefix is what isolates them between
# repos, so bare names are still collision-free.
#
# `agents` has no volume: its memory lives in the managed Postgres (ADR-002),
# so the container is fully stateless and safe to recreate.
volumes:
  keycloak-data:
