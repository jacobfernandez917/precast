name: package image

# Publish only the lock-keyed, source-free dependency package used by the signed Developer
# Computer image. A scaffold never pulls this image itself; AgentBase embeds an immutable digest.
on:
  push:
    branches: [develop]
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - apps/*/package.json
      - packages/*/package.json
      - scripts/package-image.mjs
      - docker/package-image.Dockerfile
      - .github/workflows/package-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/precast-deps

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      graph: ${{ steps.package.outputs.graph }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      # setup-node v5 auto-detects packageManager and asks pnpm for its cache path even when the
      # explicit cache option is absent, so pnpm must already be on PATH.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
      - id: package
        run: |
          graph="$(node scripts/package-image.mjs --hash)"
          echo "graph=$graph" >> "$GITHUB_OUTPUT"
          echo "tag=lock-${graph:0:16}" >> "$GITHUB_OUTPUT"

  publish:
    needs: identity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the amd64 package image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/package-image.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.identity.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            PRECAST_GRAPH_HASH=${{ needs.identity.outputs.graph }}
            PRECAST_SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=precast-package-amd64
          cache-to: type=gha,mode=max,scope=precast-package-amd64
